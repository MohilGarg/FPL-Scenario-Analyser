name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build static frontend
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://fpl-scenario-analyser-api.onrender.com' }}
        run: python frontend/build.py --output frontend/dist
      - name: Install backend and test dependencies
        run: pip install '.[test]'
      - name: Verify backend and private inference
        run: python -m unittest discover -s tests -v
      - name: Verify private frontend syntax
        run: node --check frontend/src/assistant.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
