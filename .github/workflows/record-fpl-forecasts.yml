name: Record prospective FPL forecasts

on:
  schedule:
    # UTC, off the busy top of the hour; code checks the current official deadlines.
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/record-fpl-forecasts.yml"
      - "ml/recording/**"
      - "tests/test_prospective_recording.py"
      - "tests/test_fixture_components.py"
      - "src/fpl_forfeit/assistant/component*"
      - "src/fpl_forfeit/assistant/ml_inference.py"
      - "src/fpl_forfeit/assistant/prospective.py"
      - "src/fpl_forfeit/assistant/external_forecasts.py"
      - "src/fpl_forfeit/assistant/playing_time.py"
      - "src/fpl_forfeit/assistant/fitted_forecast.py"
      - "src/fpl_forfeit/assistant/minutes_model.py"
      - "src/fpl_forfeit/assistant/minutes*v2.json"
      - "src/fpl_forfeit/assistant/selection_inputs.py"
  workflow_dispatch:
    inputs:
      mode:
        description: "record publishes only currently eligible captures; check is read-only"
        type: choice
        options: [record, check]
        default: record

# No personal access token or Assistant password. This job publishes release assets only
# and makes one tiny monthly keepalive commit on a separate operational branch.
permissions:
  contents: write

concurrency:
  group: prospective-fpl-2026-27
  cancel-in-progress: false

jobs:
  record:
    if: github.repository == 'MohilGarg/FPL-Scenario-Analyser' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: src
      FPL_HTTP_TRANSPORT: curl
      FPL_ACKNOWLEDGED_MISSING_GWS: ${{ vars.FPL_ACKNOWLEDGED_MISSING_GWS || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Capture code is pinned independently of the production application.
          ref: c9fe62487ff44b927d7364bb72c58a906253c5f0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Test deadline gating, storage, evaluation and existing inference
        run: python -m unittest tests.test_prospective_recording tests.test_live_ridge tests.test_fixture_components tests.test_external_forecasts tests.test_minutes_model tests.test_selection_inputs -v
      - name: Record or check eligible captures
        env:
          GH_TOKEN: ${{ github.token }}
          RECORD_MODE: ${{ inputs.mode || 'record' }}
        run: env -u GITHUB_SHA python -m ml.recording "$RECORD_MODE"
      - name: Compare official-final Gameweeks
        if: success() && inputs.mode != 'check'
        env:
          GH_TOKEN: ${{ github.token }}
        run: env -u GITHUB_SHA python -m ml.recording evaluate --new-actuals-only
      - name: Compare equivalent 24-hour cutoffs
        if: success() && inputs.mode != 'check'
        env:
          GH_TOKEN: ${{ github.token }}
        run: env -u GITHUB_SHA python -m ml.recording evaluate --new-actuals-only --cutoff t24h
      - name: Recovery notice
        if: failure()
        run: |
          echo "::error::Recording failed. Inspect the run summary and reserved drafts; rerun before the capture window closes. See ml/reports/PROSPECTIVE_RECORDING.md. Never recreate forecasts after a deadline."
